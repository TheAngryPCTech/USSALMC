# ADMIN.USSA.SPACE -> ussalmc-admin (127.0.0.1:8091). HTTP-only for now;
# certbot --nginx will inject the TLS server block + redirect when a cert is
# issued (same pattern as api/trader/ussa.space). Public HTTPS is required for
# the wp-admin "USSA Admin" SSO iframe: Chrome's Private Network Access policy
# blocks a public https:// page (wp-admin at ussa.space) from embedding a
# private-network target (http://localhost:8091) — both sides must be public
# HTTPS. The admin tool stays login-gated regardless (DB-backed session auth).
server {
    listen 80;
    listen [::]:80;
    server_name admin.ussa.space;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    client_max_body_size 10m;
}
