# USSA.SPACE + WWW.USSA.SPACE -> ussalmc-wordpress (127.0.0.1:8093). HTTP-only
# here; certbot --nginx injects the TLS server block + HTTP->HTTPS redirect when
# a cert is issued (same pattern as api/trader.ussa.space).
server {
    listen 80;
    listen [::]:80;
    server_name ussa.space www.ussa.space;

    # ACME HTTP-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    # WordPress media uploads
    client_max_body_size 64m;
}
