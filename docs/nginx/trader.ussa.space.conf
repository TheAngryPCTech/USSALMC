# Trader.USSA.SPACE -> USSALMC trade-route submission app (web form + bot command)
# Container published on 127.0.0.1:8092. See api.ussa.space.conf for notes.

server {
    listen 80;
    listen [::]:80;
    server_name Trader.USSA.SPACE;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name Trader.USSA.SPACE;

    ssl_certificate     /etc/letsencrypt/live/Trader.USSA.SPACE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/Trader.USSA.SPACE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8092;   # ussalmc-trade-submit container
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
