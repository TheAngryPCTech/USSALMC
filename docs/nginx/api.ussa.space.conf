# API.USSA.SPACE -> USSALMC core REST API (container published on 127.0.0.1:8090)
#
# Drop this into nginx (aaPanel: add site API.USSA.SPACE, then paste into its
# config; or plain nginx: put in /etc/nginx/sites-available and symlink). Then
# issue a cert (aaPanel Let's Encrypt, or certbot) — the 443 block assumes the
# standard aaPanel/certbot cert paths; adjust if yours differ.
#
# IMPORTANT: with a proxy in front, set TRUST_PROXY=true in .env so the API logs
# the real client IP (via X-Forwarded-For), and change the published port binding
# to 127.0.0.1 only (see docs/deployment.md) so 8090 isn't also open to the world.

server {
    listen 80;
    listen [::]:80;
    server_name API.USSA.SPACE;

    # Let's Encrypt HTTP-01 challenge (aaPanel/certbot writes here)
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # everything else -> HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name API.USSA.SPACE;

    # --- TLS (replace with your actual cert paths) ---
    ssl_certificate     /etc/letsencrypt/live/API.USSA.SPACE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/API.USSA.SPACE/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8090;   # ussalmc-api container
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
